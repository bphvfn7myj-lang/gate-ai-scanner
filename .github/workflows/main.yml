name: Gate AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openai/gpt-5.6-luna
          TOP_CANDIDATES: "12"
          AI_CANDIDATES: "8"
          MIN_24H_VOLUME_USDT: "5000000"
        run: python -c "from main import run_once; import json; print(json.dumps(run_once(), ensure_ascii=False, indent=2))"
